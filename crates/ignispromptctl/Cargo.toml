[package]
name = "ignispromptctl"
version = "0.1.0"
edition = "2021"
description = "CLI for inspecting a running ignispromptd daemon"

[[bin]]
name = "ignispromptctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
